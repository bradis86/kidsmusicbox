services:
  kids-music-hub:
    environment:
      MA_BROWSER_PLAYER_ID: ${MA_BROWSER_PLAYER_ID:-}
      BROWSER_MPD_PORT: ${BROWSER_MPD_PORT:-6600}
      INDEPENDENT_PLAYBACK: ${INDEPENDENT_PLAYBACK:-false}
      MA_DEVICE_PLAYER_IDS: ${MA_DEVICE_PLAYER_IDS:-}
    ports:
      - '${HUB_MPD_BIND_ADDRESS:-127.0.0.1}:${BROWSER_MPD_PORT:-6600}-${BROWSER_MPD_SECOND_PORT:-6601}:${BROWSER_MPD_PORT:-6600}-${BROWSER_MPD_SECOND_PORT:-6601}'
